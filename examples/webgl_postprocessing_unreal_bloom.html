	<body>
		<div id="container"></div>
		<div id="info"><a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> - Schwarzschild-lensed line paths<br>drag to orbit · wheel or pinch to zoom</div>
		<script>
			if ( [ 'localhost', '127.0.0.1', '::1' ].includes( location.hostname ) ) {
				const liveReload = new EventSource( '/__live_reload' );
				liveReload.addEventListener( 'change', () => location.reload() );
			}
		</script>
		<script type="importmap">
			{ "imports": { "three": "../build/three.module.js", "three/addons/": "./jsm/" } }
		</script>
		<script type="module">
			import * as THREE from 'three';
			import Stats from 'three/addons/libs/stats.module.js';
			import { GUI } from 'three/addons/libs/lil-gui.module.min.js';
			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
			import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
			import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
			import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
			import { createRealismLensingMaterial, loadRealismLensingTextures } from './realism-lensing.js';

			const STORAGE_KEY = 'schwarzschild-line-study-v1';
			const defaults = Object.freeze( {
				styleVersion: 10,
				// Match the official Unreal Bloom example's visible defaults.
				threshold: 0, strength: 1, radius: 0.5, exposure: 1,
				lineCount: 22, lineThickness: 0.03, lineBrightness: 2.6,
				diskInner: 2, diskWidth: 4, cameraDistance: 10.69,
				inclination: 13.24, movementAngle: 12, fieldOfView: 68,
				orbitSpeed: 0.96, resolutionScale: 1,
				renderMode: 'realism', secondaryImage: 0.62, photonRing: 1.15,
				relativisticLighting: 0.68, colorTemperature: 0.24, shadowDepth: 1,
				starField: 0.36, starLensing: 0.94
			} );
			const saved = JSON.parse( localStorage.getItem( STORAGE_KEY ) || '{}' );
			const params = { ...defaults, ...saved };
			if ( params.styleVersion !== defaults.styleVersion ) {
				Object.assign( params, {
					styleVersion: defaults.styleVersion,
					threshold: defaults.threshold,
					strength: defaults.strength,
					radius: defaults.radius,
					exposure: defaults.exposure,
					lineCount: defaults.lineCount,
					lineThickness: defaults.lineThickness,
					lineBrightness: defaults.lineBrightness,
					resolutionScale: defaults.resolutionScale,
					renderMode: defaults.renderMode,
					secondaryImage: defaults.secondaryImage,
					photonRing: defaults.photonRing,
					relativisticLighting: defaults.relativisticLighting,
					colorTemperature: defaults.colorTemperature,
					shadowDepth: defaults.shadowDepth,
					starField: defaults.starField,
					starLensing: defaults.starLensing
				} );
				localStorage.setItem( STORAGE_KEY, JSON.stringify( params ) );
			}
			// Older saved sessions used a much heavier scale that predates ray marching.
			if ( Number( saved.resolutionScale ) > 0.7 ) params.resolutionScale = defaults.resolutionScale;
			const TAU = Math.PI * 2;

			let renderer, composer, bloomPass, scene, mappingScene, camera, orbitCamera, orbitControls, stats;
			let mappingMaterial, legacyMappingMaterial, realismMappingMaterial, mappingQuad, displayMaterial;
			let mappingTarget, fullMappingTarget, previewMappingTarget, rayMapFrame, fullQualityFrame;
			let cameraSaveTimer, cameraSettleTimer, fullQualityVersion = 0;
			let syncingOrbitCamera = false;
			let realismReady = false;
			let viewControllers = [], renderModeController, realismStatus;
			let previousTime = performance.now();
			const orbitUp = new THREE.Vector3();

			const vertexShader = /* glsl */`
				varying vec2 vUv;
				void main() {
					vUv = uv;
					gl_Position = vec4( position, 1.0 );
				}
			`;

			// This is the same low-quality Schwarzschild integrator used by the
			// reference simulation. The bright upper arcs are not modeled curves:
			// each screen ray is bent until it intersects the flat XZ disk at y = 0.
			const mappingFragmentShader = /* glsl */`
				#define PI 3.141592653589793238462643383279
				// Fast sampling of the same geodesic equation. The reference simulation's
				// low preset also advances photons in 0.1-unit steps.
				#define STEP 0.1
				#define NSTEPS 180

				uniform vec2 uResolution;
				uniform vec3 uCameraPosition;
				uniform vec3 uCameraDirection;
				uniform vec3 uCameraUp;
				uniform vec3 uCameraVelocity;
				uniform float uFieldOfView;
				uniform float uDiskInner;
				uniform float uDiskWidth;

				vec3 lorentzTransformVelocity( vec3 u, vec3 v ) {
					float speedSquared = dot( v, v );
					if ( speedSquared > 0.0 ) {
						float gamma = 1.0 / sqrt( 1.0 - speedSquared );
						float denominator = 1.0 - dot( v, u );
						return ( u / gamma - v + ( gamma / ( gamma + 1.0 ) ) * dot( u, v ) * v ) / denominator;
					}
					return u;
				}

				void main() {
					float uvfov = tan( uFieldOfView * 0.5 * PI / 180.0 );
					vec2 uv = 2.0 * ( gl_FragCoord.xy / uResolution ) - 1.0;
					uv *= vec2( uResolution.x / uResolution.y, 1.0 );

					vec3 forward = normalize( uCameraDirection );
					vec3 up = normalize( uCameraUp );
					vec3 nright = normalize( cross( forward, up ) );
					up = cross( nright, forward );
					vec3 pixelPos = uCameraPosition + forward + nright * uv.x * uvfov + up * uv.y * uvfov;
					vec3 rayDir = normalize( pixelPos - uCameraPosition );
					rayDir = lorentzTransformVelocity( rayDir, uCameraVelocity );

					vec3 point = uCameraPosition;
					vec3 velocity = rayDir;
					vec3 angularMomentum = cross( point, velocity );
					float h2 = dot( angularMomentum, angularMomentum );
					// Rays this far outside the disk cannot create a visible lensed line.
					// Rejecting them before the loop keeps empty background pixels cheap.
					float angularLimit = uDiskInner + uDiskWidth + 2.5;
					if ( h2 > angularLimit * angularLimit ) {
						gl_FragColor = vec4( 0.0 );
						return;
					}
					float rayGamma = 1.0 / sqrt( 1.0 - dot( uCameraVelocity, uCameraVelocity ) );
					float rayDoppler = rayGamma * ( 1.0 + dot( rayDir, -uCameraVelocity ) );
					float rayIntensity = 1.0 / ( rayDoppler * rayDoppler * rayDoppler );
					float escapeRadius = max( length( uCameraPosition ) + 1.0, uDiskInner + uDiskWidth + 1.0 );
					float escapeRadiusSquared = escapeRadius * escapeRadius;
					float oldRadiusSquared = dot( point, point );
					vec3 oldpoint;

					for ( int i = 0; i < NSTEPS; i ++ ) {
						oldpoint = point;
						point += velocity * STEP;
						float radiusSquared = dot( point, point );
						float inverseRadius = inversesqrt( radiusSquared );
						float inverseRadiusSquared = 1.0 / radiusSquared;
						vec3 accel = -1.5 * h2 * point * inverseRadiusSquared * inverseRadiusSquared * inverseRadius;
						velocity += accel * STEP;

						if ( radiusSquared < 1.0 && oldRadiusSquared > 1.0 ) break;

						if ( oldpoint.y * point.y < 0.0 ) {
							float lambda = -oldpoint.y / velocity.y;
							vec3 intersection = oldpoint + lambda * velocity;
							float r = length( intersection );
							if ( uDiskInner <= r && r <= uDiskInner + uDiskWidth ) {
								float phi = atan( intersection.x, intersection.z );
								vec3 diskVelocity = vec3( -intersection.x, 0.0, intersection.z ) /
									sqrt( 2.0 * ( r - 1.0 ) ) / ( r * r );
								phi = mod( phi + PI * 2.0, PI * 2.0 );
								float diskGamma = 1.0 / sqrt( 1.0 - dot( diskVelocity, diskVelocity ) );
								float distanceFromHole = sqrt( radiusSquared );
								float diskDoppler = diskGamma * ( 1.0 + dot( rayDir / distanceFromHole, diskVelocity ) );
								vec2 diskUv = vec2( phi / ( 2.0 * PI ), 1.0 - ( r - uDiskInner ) / uDiskWidth );
								float gain = rayIntensity / ( rayDoppler * diskDoppler );
								gl_FragColor = vec4( diskUv, gain, 1.0 );
								return;
							}
						}

						// Once an unbound ray has passed both the camera and the disk while
						// travelling outward, it cannot produce a later disk intersection.
						if ( radiusSquared > escapeRadiusSquared && dot( point, velocity ) > 0.0 ) break;
						oldRadiusSquared = radiusSquared;
					}

					gl_FragColor = vec4( 0.0 );
				}
			`;

			// The expensive geodesic result above is static. Normal animation frames
			// only move the disk texture through this cached UV map.
			const displayFragmentShader = /* glsl */`
				#define PI 3.141592653589793238462643383279
				#define TAU 6.283185307179586476925286766559
				varying vec2 vUv;
				uniform float uTime;
				uniform float uBrightness;
				uniform float uLineCount;
				uniform float uLineThickness;
				uniform float uRealism;
				uniform float uSecondaryImage;
				uniform float uPhotonRing;
				uniform float uRelativisticLighting;
				uniform float uColorTemperature;
				uniform float uStarField;
				uniform float uStarLensing;
				uniform float uShadowDepth;
				uniform vec2 uStarViewOffset;
				uniform float uCameraDistance;
				uniform float uCameraAzimuth;
				uniform float uFieldOfView;
				uniform float uDiskInner;
				uniform float uDiskWidth;
				uniform vec2 uViewport;
				uniform sampler2D uRayMap;

				float random( float value ) {
					return fract( sin( value * 12.9898 ) * 43758.5453 );
				}

				float random2( vec2 value ) {
					return fract( sin( dot( value, vec2( 127.1, 311.7 ) ) ) * 43758.5453 );
				}

				float filamentMask( vec2 diskUv ) {
					float validUv = step( 0.0, diskUv.y ) * step( diskUv.y, 1.0 );
					float laneCoordinate = diskUv.y * ( uLineCount + 1.0 );
					float laneIndex = floor( laneCoordinate + 0.5 );
					float validLane = step( 0.5, laneIndex ) * step( laneIndex, uLineCount + 0.5 );
					float radialDistance = abs( laneCoordinate - laneIndex ) / ( uLineCount + 1.0 );
					float halfWidth = 0.00065 + uLineThickness * 0.009;
					float antialiasWidth = max( fwidth( diskUv.y ) * 1.25, 0.00035 );
					float coreMask = 1.0 - smoothstep( halfWidth - antialiasWidth, halfWidth + antialiasWidth, radialDistance );

					// Every lane has stable random segment lengths, gaps, speed and direction.
					// Moving disk azimuth through this pattern makes the motion unmistakable.
					float laneSeed = laneIndex * 19.731;
					float direction = random( laneSeed + 2.0 ) > 0.42 ? 1.0 : -1.0;
					float speed = mix( 0.55, 1.35, random( laneSeed + 4.0 ) );
					float timePhase = mod( uTime, PI * 2.0 ) / ( PI * 2.0 );
					float movingPhi = fract( diskUv.x - direction * timePhase * speed + random( laneSeed + 6.0 ) );
					float segmentCount = floor( mix( 5.0, 12.0, random( laneSeed + 8.0 ) ) );
					float segmentCoordinate = movingPhi * segmentCount;
					float cell = floor( segmentCoordinate );
					float localPosition = fract( segmentCoordinate );
					float cellSeed = laneSeed + cell * 31.417;
					float segmentStart = mix( 0.025, 0.16, random( cellSeed + 10.0 ) );
					float segmentLength = mix( 0.24, 0.82, random( cellSeed + 12.0 ) );
					float segmentEnd = min( 0.97, segmentStart + segmentLength );
					float endFeather = max( fwidth( segmentCoordinate ) * 1.25, 0.012 );
					float segmentMask = smoothstep( segmentStart - endFeather, segmentStart + endFeather, localPosition ) *
						( 1.0 - smoothstep( segmentEnd - endFeather, segmentEnd + endFeather, localPosition ) );
					return coreMask * segmentMask * validLane * validUv;
				}

				vec3 realismEmission( vec2 diskUv, float imageEnergy ) {
					if ( diskUv.y < 0.0 || diskUv.y > 1.0 ) return vec3( 0.0 );
					float filament = filamentMask( diskUv );
					float heat = pow( clamp( diskUv.y, 0.0, 1.0 ), 0.68 );
					float phi = diskUv.x * TAU;
					float approach = sin( uCameraAzimuth - phi );
					float beta = mix( 0.20, 0.46, heat ) * uRelativisticLighting;
					float doppler = sqrt( max( 1.0 - beta * beta, 0.01 ) ) / max( 1.0 - beta * approach, 0.2 );
					float physicalInner = max( uDiskInner, 3.0 );
					float physicalOuter = max( uDiskInner + uDiskWidth, physicalInner + 0.1 );
					float radius = mix( physicalOuter, physicalInner, clamp( diskUv.y, 0.0, 1.0 ) );
					float gravitationalShift = sqrt( max( 1.0 - 1.0 / max( radius, 1.001 ), 0.04 ) );
					float gain = clamp( doppler * doppler * doppler, 0.28, 3.1 );
					gain *= mix( 1.0, gravitationalShift, uRelativisticLighting * 0.28 );

					vec3 hotColor = mix( vec3( 1.0, 0.48, 0.18 ), vec3( 0.92, 0.98, 1.0 ), smoothstep( 0.0, 1.0, heat ) );
					vec3 shiftColor = doppler >= 1.0 ? vec3( 0.68, 0.84, 1.0 ) : vec3( 1.0, 0.34, 0.12 );
					hotColor = mix( hotColor, shiftColor, min( abs( doppler - 1.0 ) * 0.45, 0.28 ) );
					vec3 color = mix( vec3( 1.0 ), hotColor, uColorTemperature );
					return color * filament * gain * imageEnergy;
				}

				vec2 screenPosition() {
					vec2 screen = vUv * 2.0 - 1.0;
					screen.x *= uViewport.x / max( uViewport.y, 1.0 );
					return screen;
				}

				float impactParameter( vec2 screen ) {
					float tangent = length( screen ) * tan( uFieldOfView * 0.5 * PI / 180.0 );
					float sinTheta = tangent / sqrt( 1.0 + tangent * tangent );
					return uCameraDistance * sinTheta / sqrt( max( 1.0 - 1.0 / uCameraDistance, 0.01 ) );
				}

				float criticalRingMask( float impact ) {
					float width = max( fwidth( impact ) * 1.5, 0.008 );
					return 1.0 - smoothstep( width, width * 4.0, abs( impact - sqrt( 27.0 / 4.0 ) ) );
				}

				float rimLayer( float impact, float angle, float cellCount, float seed, float radialOffset ) {
					float angularCoordinate = fract( angle / TAU + 1.0 ) * cellCount;
					float cell = floor( angularCoordinate );
					float localPosition = fract( angularCoordinate );
					float cellSeed = cell * 23.71 + seed;
					float variation = random( cellSeed );
					float segmentStart = mix( 0.04, 0.24, random( cellSeed + 2.0 ) );
					float segmentEnd = min( 0.97, segmentStart + mix( 0.28, 0.78, random( cellSeed + 4.0 ) ) );
					float angularFeather = max( fwidth( angularCoordinate ) * 1.25, 0.016 );
					float segment = smoothstep( segmentStart - angularFeather, segmentStart + angularFeather, localPosition ) *
						( 1.0 - smoothstep( segmentEnd - angularFeather, segmentEnd + angularFeather, localPosition ) );

					float criticalImpact = sqrt( 27.0 / 4.0 );
					float ringCenter = criticalImpact + radialOffset + ( variation - 0.5 ) * 0.07;
					float radialWidth = max( fwidth( impact ) * 0.72, 0.0035 );
					float radialLine = 1.0 - smoothstep( radialWidth * 0.45, radialWidth * 1.7, abs( impact - ringCenter ) );
					float visible = step( 0.25, random( cellSeed + 8.0 ) );
					return segment * radialLine * visible * mix( 0.35, 1.0, variation );
				}

				vec3 escapingRim( vec2 screen, float impact ) {
					float angle = atan( screen.y, screen.x );
					float arcs = rimLayer( impact, angle, 13.0, 13.0, 0.018 ) +
						rimLayer( impact, angle, 23.0, 71.0, 0.082 ) * 0.58 +
						rimLayer( impact, angle, 17.0, 37.0, -0.045 ) * 0.5;
					vec3 spectralRim = mix( vec3( 1.0, 0.72, 0.5 ), vec3( 0.76, 0.88, 1.0 ), uColorTemperature );
					vec3 rimColor = mix( vec3( 1.0 ), spectralRim, uColorTemperature * 0.45 );
					return rimColor * arcs * uBrightness * uPhotonRing * 0.095;
				}

				float starLayer( vec2 screen, float impact, float scale, float seed ) {
					float screenRadius = max( length( screen ), 1e-5 );
					vec2 radialDirection = screen / screenRadius;
					vec2 tangentDirection = vec2( -radialDirection.y, radialDirection.x );
					float criticalImpact = sqrt( 27.0 / 4.0 );
					float lensZone = 1.0 - smoothstep( 0.12, 3.2, abs( impact - criticalImpact ) );
					float lensOffset = uStarLensing * ( 0.016 / ( screenRadius + 0.16 ) + lensZone * 0.052 );
					vec2 sourcePosition = screen + radialDirection * lensOffset + uStarViewOffset;
					vec2 gridPosition = sourcePosition * scale;
					vec2 cell = floor( gridPosition );
					vec2 localPosition = fract( gridPosition ) - 0.5;
					float existence = random2( cell + vec2( seed, seed * 0.37 ) );
					float densityThreshold = mix( 0.997, 0.982, clamp( uStarField / 1.5, 0.0, 1.0 ) );
					float visible = step( densityThreshold, existence );
					vec2 starPosition = vec2(
						random2( cell + vec2( seed + 4.0, seed + 9.0 ) ),
						random2( cell + vec2( seed + 17.0, seed + 3.0 ) )
					) - 0.5;
					vec2 delta = localPosition - starPosition * 0.72;
					float radialDelta = dot( delta, radialDirection );
					float tangentialStretch = 1.0 + lensZone * uStarLensing * 7.5;
					float tangentialDelta = dot( delta, tangentDirection ) / tangentialStretch;
					float distanceToStar = length( vec2( radialDelta, tangentialDelta ) );
					float size = mix( 0.022, 0.058, random2( cell + vec2( seed + 31.0 ) ) );
					float antialias = max( fwidth( distanceToStar ) * 1.35, 0.004 );
					float shape = 1.0 - smoothstep( size, size + antialias, distanceToStar );
					float brightness = mix( 0.12, 0.72, random2( cell + vec2( seed + 53.0 ) ) );
					return visible * shape * brightness;
				}

				vec3 lensedStars( vec2 screen, float impact ) {
					if ( uStarField <= 0.0 ) return vec3( 0.0 );
					float criticalImpact = sqrt( 27.0 / 4.0 );
					float outsideShadow = smoothstep( criticalImpact - 0.01, criticalImpact + 0.08, impact );
					float coolLayer = starLayer( screen, impact, 29.0, 11.0 );
					float warmLayer = starLayer( screen, impact, 47.0, 83.0 );
					vec3 stars = vec3( 0.62, 0.78, 1.0 ) * coolLayer + vec3( 1.0, 0.78, 0.52 ) * warmLayer * 0.76;
					return stars * outsideShadow * uStarField;
				}

				void main() {
					vec4 rayMap = texture2D( uRayMap, vUv );
					float emitterEnergy = uBrightness * 0.18;
					if ( uRealism < 0.5 ) {
						float intensity = filamentMask( rayMap.xy ) * emitterEnergy * rayMap.z * step( 0.5, rayMap.a );
						gl_FragColor = vec4( vec3( max( intensity, 0.0 ) ), 1.0 );
						return;
					}

					vec2 screen = screenPosition();
					float impact = impactParameter( screen );
					float criticalImpact = sqrt( 27.0 / 4.0 );
					float shadowFeather = max( fwidth( impact ) * 2.0, 0.012 );
					float captureBoundary = smoothstep( criticalImpact - shadowFeather, criticalImpact + shadowFeather * 2.0, impact );
					float primaryVisibility = mix( 1.0, captureBoundary, uShadowDepth );
					// The direct disk is occluded by the capture shadow. The secondary
					// lensed image remains partially visible in front, so curved segmented
					// filaments cross the ball without restoring a straight equatorial cut.
					float secondaryVisibility = mix( 1.0, mix( 0.58, 1.0, captureBoundary ), uShadowDepth );

					vec3 primary = realismEmission( rayMap.xy, emitterEnergy * 1.12 ) * primaryVisibility;
					vec3 secondary = vec3( 0.0 );
					if ( uSecondaryImage > 0.0 && rayMap.w >= 0.0 && rayMap.w <= 1.0 ) {
						float ringBoost = 1.0 + criticalRingMask( impact ) * uPhotonRing * 1.8;
						secondary = realismEmission( rayMap.zw, emitterEnergy * uSecondaryImage * 0.72 * ringBoost ) * secondaryVisibility;
					}
					vec3 rim = escapingRim( screen, impact );
					vec3 stars = lensedStars( screen, impact );
					gl_FragColor = vec4( max( stars + primary + secondary + rim, vec3( 0.0 ) ), 1.0 );
				}
			`;

			function syncRelativisticUniforms( position ) {
				if ( displayMaterial ) {
					displayMaterial.uniforms.uCameraDistance.value = position.length();
					displayMaterial.uniforms.uCameraAzimuth.value = Math.atan2( position.x, position.z );
					displayMaterial.uniforms.uFieldOfView.value = params.fieldOfView;
					displayMaterial.uniforms.uDiskInner.value = params.diskInner;
					displayMaterial.uniforms.uDiskWidth.value = params.diskWidth;
					const inverseDistance = 1 / Math.max( position.length(), 0.0001 );
					displayMaterial.uniforms.uStarViewOffset.value.set(
						position.x * inverseDistance * 0.28,
						position.y * inverseDistance * 0.28
					);
				}
			}

			function updateCameraUniforms() {
				const distance = params.cameraDistance;
				const incline = THREE.MathUtils.degToRad( params.inclination );
				const pathAngle = THREE.MathUtils.degToRad( params.movementAngle );
				const orbitY = Math.sin( incline ) * distance;
				const orbitZ = Math.cos( incline ) * distance;
				const position = mappingMaterial.uniforms.uCameraPosition.value;
				position.set( -orbitY * Math.sin( pathAngle ), orbitY * Math.cos( pathAngle ), orbitZ );

				if ( orbitCamera ) {
					syncingOrbitCamera = true;
					orbitCamera.position.copy( position );
					orbitCamera.lookAt( 0, 0, 0 );
					orbitControls?.update();
					syncingOrbitCamera = false;
					applyOrbitCameraToUniforms();
					return;
				}

				mappingMaterial.uniforms.uCameraDirection.value.copy( position ).multiplyScalar( -1 ).normalize();
				const worldUp = Math.abs( mappingMaterial.uniforms.uCameraDirection.value.y ) > 0.98 ?
					new THREE.Vector3( 0, 0, 1 ) : new THREE.Vector3( 0, 1, 0 );
				const right = new THREE.Vector3().crossVectors( mappingMaterial.uniforms.uCameraDirection.value, worldUp ).normalize();
				mappingMaterial.uniforms.uCameraUp.value.crossVectors( right, mappingMaterial.uniforms.uCameraDirection.value ).normalize();
				mappingMaterial.uniforms.uCameraVelocity.value.set( Math.cos( pathAngle ), Math.sin( pathAngle ), 0 ).multiplyScalar( 0.42 * 0.022 );
				mappingMaterial.uniforms.uFieldOfView.value = params.fieldOfView;
				mappingMaterial.uniforms.uDiskInner.value = params.diskInner;
				mappingMaterial.uniforms.uDiskWidth.value = params.diskWidth;
				syncRelativisticUniforms( position );
			}

			function applyOrbitCameraToUniforms() {
				const position = orbitCamera.position;
				const pathAngle = THREE.MathUtils.degToRad( params.movementAngle );
				mappingMaterial.uniforms.uCameraPosition.value.copy( position );
				mappingMaterial.uniforms.uCameraDirection.value.copy( orbitControls.target ).sub( position ).normalize();
				orbitUp.set( 0, 1, 0 ).applyQuaternion( orbitCamera.quaternion ).normalize();
				mappingMaterial.uniforms.uCameraUp.value.copy( orbitUp );
				mappingMaterial.uniforms.uCameraVelocity.value.set( Math.cos( pathAngle ), Math.sin( pathAngle ), 0 ).multiplyScalar( 0.42 * 0.022 );
				mappingMaterial.uniforms.uFieldOfView.value = params.fieldOfView;
				mappingMaterial.uniforms.uDiskInner.value = params.diskInner;
				mappingMaterial.uniforms.uDiskWidth.value = params.diskWidth;
				syncRelativisticUniforms( position );
			}

			function updateRealismStatus( message ) {
				if ( realismStatus ) realismStatus.textContent = message;
			}

			function applyRenderMode() {
				const useRealism = params.renderMode === 'realism' && realismReady;
				mappingMaterial = useRealism ? realismMappingMaterial : legacyMappingMaterial;
				if ( mappingQuad ) mappingQuad.material = mappingMaterial;
				if ( displayMaterial ) displayMaterial.uniforms.uRealism.value = useRealism ? 1 : 0;
				updateRealismStatus( useRealism ? 'realism LUT active' :
					params.renderMode === 'realism' ? 'loading realism LUT…' : 'legacy marcher active' );
				updateCameraUniforms();
				cancelFullQualityRefinement();
				if ( previewMappingTarget ) mappingTarget = previewMappingTarget;
				if ( renderer && mappingTarget ) rebuildRayMap();
				restoreFullQualitySoon();
			}

			async function loadRealismRenderer() {
				updateRealismStatus( 'loading realism LUT…' );
				try {
					const textures = await loadRealismLensingTextures();
					realismMappingMaterial = createRealismLensingMaterial( legacyMappingMaterial.uniforms, textures );
					realismReady = true;
					applyRenderMode();
					renderModeController?.updateDisplay();
				} catch ( error ) {
					console.error( error );
					params.renderMode = 'legacy';
					localStorage.setItem( STORAGE_KEY, JSON.stringify( params ) );
					updateRealismStatus( 'realism LUT unavailable · legacy active' );
					renderModeController?.updateDisplay();
				}
			}

			function saveCameraViewSoon() {
				clearTimeout( cameraSaveTimer );
				cameraSaveTimer = setTimeout( () => {
					localStorage.setItem( STORAGE_KEY, JSON.stringify( params ) );
				}, 180 );
			}

			function restoreFullQualitySoon() {
				clearTimeout( cameraSettleTimer );
				cameraSettleTimer = setTimeout( () => {
					startFullQualityRefinement();
				}, 140 );
			}

			function cancelFullQualityRefinement() {
				fullQualityVersion ++;
				if ( fullQualityFrame ) cancelAnimationFrame( fullQualityFrame );
				fullQualityFrame = 0;
			}

			function requestInteractiveRayMap() {
				cancelFullQualityRefinement();
				if ( previewMappingTarget ) mappingTarget = previewMappingTarget;
				scheduleRayMap();
				restoreFullQualitySoon();
			}

			function onOrbitChange() {
				if ( syncingOrbitCamera ) return;
				const position = orbitCamera.position;
				const distance = Math.max( 0.0001, position.length() );
				params.cameraDistance = THREE.MathUtils.clamp( distance, orbitControls.minDistance, orbitControls.maxDistance );
				params.inclination = THREE.MathUtils.radToDeg( Math.acos( THREE.MathUtils.clamp( position.z / distance, -1, 1 ) ) );
				params.movementAngle = THREE.MathUtils.radToDeg( Math.atan2( -position.x, position.y ) );
				applyOrbitCameraToUniforms();
				viewControllers.forEach( ( controller ) => controller.updateDisplay() );
				requestInteractiveRayMap();
				saveCameraViewSoon();
			}

			function beginCameraInteraction() {
				renderer.domElement.style.cursor = 'grabbing';
			}

			function endCameraInteraction() {
				renderer.domElement.style.cursor = 'grab';
				restoreFullQualitySoon();
				saveCameraViewSoon();
			}

			function rebuildRayMap() {
				if ( ! renderer || ! mappingTarget ) return;
				mappingMaterial.uniforms.uResolution.value.set( mappingTarget.width, mappingTarget.height );
				const previousTarget = renderer.getRenderTarget();
				renderer.setRenderTarget( mappingTarget );
				renderer.clear();
				renderer.render( mappingScene, camera );
				renderer.setRenderTarget( previousTarget );
				displayMaterial.uniforms.uRayMap.value = mappingTarget.texture;
			}

			function startFullQualityRefinement() {
				if ( ! renderer || ! fullMappingTarget ) return;
				cancelFullQualityRefinement();
				if ( rayMapFrame ) cancelAnimationFrame( rayMapFrame );
				rayMapFrame = 0;
				const version = fullQualityVersion;
				const target = fullMappingTarget;
				const pixelCount = target.width * target.height;
				const tileCount = params.renderMode === 'realism' && realismReady ? 1 :
					THREE.MathUtils.clamp( Math.ceil( pixelCount / 450000 ), 2, 12 );
				let tileIndex = 0;

				mappingMaterial.uniforms.uResolution.value.set( target.width, target.height );
				const previousTarget = renderer.getRenderTarget();
				renderer.setRenderTarget( target );
				renderer.setScissorTest( false );
				renderer.clear();
				renderer.setRenderTarget( previousTarget );

				const renderNextTile = () => {
					if ( version !== fullQualityVersion ) return;
					const y = Math.floor( tileIndex * target.height / tileCount );
					const nextY = Math.floor( ( tileIndex + 1 ) * target.height / tileCount );
					const oldTarget = renderer.getRenderTarget();
					const oldScissorTest = renderer.getScissorTest();

					mappingMaterial.uniforms.uResolution.value.set( target.width, target.height );
					renderer.setRenderTarget( target );
					renderer.setScissor( 0, y, target.width, nextY - y );
					renderer.setScissorTest( true );
					renderer.render( mappingScene, camera );
					renderer.setScissorTest( oldScissorTest );
					renderer.setRenderTarget( oldTarget );

					tileIndex ++;
					if ( tileIndex < tileCount ) {
						fullQualityFrame = requestAnimationFrame( renderNextTile );
					} else {
						fullQualityFrame = 0;
						mappingTarget = target;
						displayMaterial.uniforms.uRayMap.value = target.texture;
					}
				};

				fullQualityFrame = requestAnimationFrame( renderNextTile );
			}

			function scheduleRayMap() {
				if ( rayMapFrame ) return;
				rayMapFrame = requestAnimationFrame( () => {
					rayMapFrame = 0;
					rebuildRayMap();
				} );
			}

			function updateSimulation() {
				updateCameraUniforms();
				requestInteractiveRayMap();
			}

			function updateLineStyle() {
				displayMaterial.uniforms.uLineCount.value = Math.round( params.lineCount );
				displayMaterial.uniforms.uLineThickness.value = params.lineThickness;
			}

			function saveAndApply( action = updateSimulation ) {
				localStorage.setItem( STORAGE_KEY, JSON.stringify( params ) );
				action();
			}

			function addControl( folder, key, label, min, max, step, action = updateSimulation ) {
				return folder.add( params, key, min, max, step ).name( label ).onChange( () => saveAndApply( action ) );
			}

			function init() {
				const container = document.getElementById( 'container' );
				realismStatus = document.createElement( 'span' );
				realismStatus.className = 'realism-status';
				document.getElementById( 'info' ).append( document.createElement( 'br' ), realismStatus );
				scene = new THREE.Scene();
				scene.background = new THREE.Color( 0x000000 );
				mappingScene = new THREE.Scene();
				camera = new THREE.OrthographicCamera( -1, 1, 1, -1, 0, 1 );

				legacyMappingMaterial = new THREE.ShaderMaterial( {
					vertexShader,
					fragmentShader: mappingFragmentShader,
					depthTest: false,
					depthWrite: false,
					uniforms: {
						uResolution: { value: new THREE.Vector2() },
						uCameraPosition: { value: new THREE.Vector3() },
						uCameraDirection: { value: new THREE.Vector3() },
						uCameraUp: { value: new THREE.Vector3() },
						uCameraVelocity: { value: new THREE.Vector3() },
						uFieldOfView: { value: params.fieldOfView },
						uDiskInner: { value: params.diskInner },
						uDiskWidth: { value: params.diskWidth }
					}
				} );
				mappingMaterial = legacyMappingMaterial;
				mappingQuad = new THREE.Mesh( new THREE.PlaneGeometry( 2, 2 ), mappingMaterial );
				mappingScene.add( mappingQuad );
				displayMaterial = new THREE.ShaderMaterial( {
					vertexShader,
					fragmentShader: displayFragmentShader,
					depthTest: false,
					depthWrite: false,
					uniforms: {
						uTime: { value: 0 },
						uBrightness: { value: params.lineBrightness },
						uLineCount: { value: Math.round( params.lineCount ) },
						uLineThickness: { value: params.lineThickness },
						uRealism: { value: 0 },
						uSecondaryImage: { value: params.secondaryImage },
						uPhotonRing: { value: params.photonRing },
						uRelativisticLighting: { value: params.relativisticLighting },
						uColorTemperature: { value: params.colorTemperature },
						uStarField: { value: params.starField },
						uStarLensing: { value: params.starLensing },
						uShadowDepth: { value: params.shadowDepth },
						uStarViewOffset: { value: new THREE.Vector2() },
						uCameraDistance: { value: params.cameraDistance },
						uCameraAzimuth: { value: 0 },
						uFieldOfView: { value: params.fieldOfView },
						uDiskInner: { value: params.diskInner },
						uDiskWidth: { value: params.diskWidth },
						uViewport: { value: new THREE.Vector2( innerWidth, innerHeight ) },
						uRayMap: { value: null }
					}
				} );
				scene.add( new THREE.Mesh( new THREE.PlaneGeometry( 2, 2 ), displayMaterial ) );
				updateCameraUniforms();

				renderer = new THREE.WebGLRenderer( { antialias: true, powerPreference: 'high-performance' } );
				renderer.setPixelRatio( Math.min( devicePixelRatio, 2 ) * params.resolutionScale );
				renderer.setSize( innerWidth, innerHeight );
				renderer.toneMapping = THREE.ACESFilmicToneMapping;
				renderer.toneMappingExposure = Math.pow( params.exposure, 4.0 );
				renderer.domElement.style.cursor = 'grab';
				container.appendChild( renderer.domElement );

				orbitCamera = new THREE.PerspectiveCamera( params.fieldOfView, innerWidth / innerHeight, 0.1, 100 );
				orbitCamera.position.copy( mappingMaterial.uniforms.uCameraPosition.value );
				orbitCamera.lookAt( 0, 0, 0 );
				orbitControls = new OrbitControls( orbitCamera, renderer.domElement );
				orbitControls.target.set( 0, 0, 0 );
				orbitControls.enableDamping = true;
				orbitControls.dampingFactor = 0.18;
				orbitControls.enablePan = false;
				orbitControls.rotateSpeed = 0.55;
				orbitControls.zoomSpeed = 0.75;
				orbitControls.minDistance = 4;
				orbitControls.maxDistance = 24;
				orbitControls.minPolarAngle = THREE.MathUtils.degToRad( 0.5 );
				orbitControls.maxPolarAngle = THREE.MathUtils.degToRad( 179.5 );
				orbitControls.update();
				orbitControls.addEventListener( 'start', beginCameraInteraction );
				orbitControls.addEventListener( 'change', onOrbitChange );
				orbitControls.addEventListener( 'end', endCameraInteraction );

				const renderPass = new RenderPass( scene, camera );
				bloomPass = new UnrealBloomPass(
					new THREE.Vector2( innerWidth, innerHeight ),
					params.strength,
					params.radius,
					params.threshold
				);
				composer = new EffectComposer( renderer );
				composer.addPass( renderPass );
				composer.addPass( bloomPass );
				composer.addPass( new OutputPass() );

				stats = new Stats();
				container.appendChild( stats.dom );

				const gui = new GUI();
				const realismFolder = gui.addFolder( 'realism renderer' );
				renderModeController = realismFolder.add( params, 'renderMode', {
					'realism · lookup tables': 'realism',
					'legacy · ray marcher': 'legacy'
				} ).name( 'renderer' ).onChange( () => saveAndApply( applyRenderMode ) );
				addControl( realismFolder, 'secondaryImage', 'secondary image', 0, 1.5, 0.01, () => {
					displayMaterial.uniforms.uSecondaryImage.value = params.secondaryImage;
				} );
				addControl( realismFolder, 'photonRing', 'photon ring', 0, 2, 0.01, () => {
					displayMaterial.uniforms.uPhotonRing.value = params.photonRing;
				} );
				addControl( realismFolder, 'relativisticLighting', 'relativistic light', 0, 1, 0.01, () => {
					displayMaterial.uniforms.uRelativisticLighting.value = params.relativisticLighting;
				} );
				addControl( realismFolder, 'colorTemperature', 'temperature color', 0, 1, 0.01, () => {
					displayMaterial.uniforms.uColorTemperature.value = params.colorTemperature;
				} );
				addControl( realismFolder, 'shadowDepth', 'shadow depth', 0, 1, 0.01, () => {
					displayMaterial.uniforms.uShadowDepth.value = params.shadowDepth;
				} );
				addControl( realismFolder, 'starField', 'lensed stars', 0, 1.5, 0.01, () => {
					displayMaterial.uniforms.uStarField.value = params.starField;
				} );
				addControl( realismFolder, 'starLensing', 'star deformation', 0, 1.5, 0.01, () => {
					displayMaterial.uniforms.uStarLensing.value = params.starLensing;
				} );

				const pathFolder = gui.addFolder( 'simulation path' );
				addControl( pathFolder, 'lineCount', 'line count', 1, 30, 1, updateLineStyle );
				addControl( pathFolder, 'lineThickness', 'line thickness', 0.01, 0.5, 0.01, updateLineStyle );
				addControl( pathFolder, 'diskInner', 'inner radius', 1.05, 5, 0.01 );
				addControl( pathFolder, 'diskWidth', 'disk width', 0.25, 8, 0.01 );
				addControl( pathFolder, 'orbitSpeed', 'path speed', -3, 3, 0.01, () => {} );

				const viewFolder = gui.addFolder( 'lensing view' );
				viewControllers = [
					addControl( viewFolder, 'cameraDistance', 'camera distance', 4, 24, 0.01 ),
					addControl( viewFolder, 'inclination', 'inclination', 0.1, 179.9, 0.01 ),
					addControl( viewFolder, 'movementAngle', 'view rotation', -180, 180, 0.01 )
				];
				addControl( viewFolder, 'fieldOfView', 'field of view', 25, 110, 0.1 );
				addControl( viewFolder, 'lineBrightness', 'brightness', 0.1, 6, 0.01, () => displayMaterial.uniforms.uBrightness.value = params.lineBrightness );

				const bloomFolder = gui.addFolder( 'bloom' );
				addControl( bloomFolder, 'threshold', 'threshold', 0, 1, 0.01, () => bloomPass.threshold = params.threshold );
				addControl( bloomFolder, 'strength', 'strength', 0, 3, 0.01, () => bloomPass.strength = params.strength );
				addControl( bloomFolder, 'radius', 'radius', 0, 1, 0.01, () => bloomPass.radius = params.radius );
				addControl( bloomFolder, 'exposure', 'exposure', 0.1, 2, 0.01, () => renderer.toneMappingExposure = Math.pow( params.exposure, 4.0 ) );

				const performanceFolder = gui.addFolder( 'performance' );
				addControl( performanceFolder, 'resolutionScale', 'render scale', 0.5, 1, 0.05, onWindowResize );

				const actions = {
					reset() {
						Object.assign( params, defaults );
						localStorage.removeItem( STORAGE_KEY );
						gui.controllersRecursive().forEach( ( controller ) => controller.updateDisplay() );
						updateLineStyle();
						displayMaterial.uniforms.uSecondaryImage.value = params.secondaryImage;
						displayMaterial.uniforms.uPhotonRing.value = params.photonRing;
						displayMaterial.uniforms.uRelativisticLighting.value = params.relativisticLighting;
						displayMaterial.uniforms.uColorTemperature.value = params.colorTemperature;
						displayMaterial.uniforms.uStarField.value = params.starField;
						displayMaterial.uniforms.uStarLensing.value = params.starLensing;
						displayMaterial.uniforms.uShadowDepth.value = params.shadowDepth;
						updateCameraUniforms();
						applyRenderMode();
						displayMaterial.uniforms.uBrightness.value = params.lineBrightness;
						bloomPass.threshold = params.threshold;
						bloomPass.strength = params.strength;
						bloomPass.radius = params.radius;
						renderer.toneMappingExposure = Math.pow( params.exposure, 4.0 );
						onWindowResize();
					}
				};
				gui.add( actions, 'reset' ).name( 'reset saved values' );

				addEventListener( 'resize', onWindowResize );
				document.addEventListener( 'visibilitychange', onVisibilityChange );
				onWindowResize();
				renderer.setAnimationLoop( animate );
				loadRealismRenderer();
			}

			function createMappingTarget( width, height ) {
				return new THREE.WebGLRenderTarget( width, height, {
					type: THREE.HalfFloatType,
					format: THREE.RGBAFormat,
					minFilter: THREE.LinearFilter,
					magFilter: THREE.LinearFilter,
					depthBuffer: false,
					stencilBuffer: false
				} );
			}

			function onWindowResize() {
				cancelFullQualityRefinement();
				if ( rayMapFrame ) cancelAnimationFrame( rayMapFrame );
				rayMapFrame = 0;
				const pixelRatio = Math.min( devicePixelRatio, 2 ) * params.resolutionScale;
				renderer.setPixelRatio( pixelRatio );
				renderer.setSize( innerWidth, innerHeight );
				composer.setPixelRatio( pixelRatio );
				composer.setSize( innerWidth, innerHeight );
				displayMaterial.uniforms.uViewport.value.set( innerWidth, innerHeight );
				orbitCamera.aspect = innerWidth / innerHeight;
				orbitCamera.updateProjectionMatrix();
				const size = renderer.getDrawingBufferSize( new THREE.Vector2() );
				fullMappingTarget?.dispose();
				previewMappingTarget?.dispose();
				fullMappingTarget = createMappingTarget( size.x, size.y );
				previewMappingTarget = createMappingTarget(
					Math.max( 1, Math.round( size.x * 0.35 ) ),
					Math.max( 1, Math.round( size.y * 0.35 ) )
				);
				mappingTarget = previewMappingTarget;
				rebuildRayMap();
				restoreFullQualitySoon();
			}

			function onVisibilityChange() {
				if ( document.hidden ) {
					renderer.setAnimationLoop( null );
				} else {
					previousTime = performance.now();
					renderer.setAnimationLoop( animate );
				}
			}

			function animate( now ) {
				const delta = Math.min( 0.05, Math.max( 0, ( now - previousTime ) / 1000 ) );
				previousTime = now;
				orbitControls?.update( delta );
				displayMaterial.uniforms.uTime.value = ( displayMaterial.uniforms.uTime.value + delta * params.orbitSpeed ) % TAU;
				stats.update();
				composer.render( delta );
			}

			init();
		</script>
	</body>
</html>
